[workspace]
resolver = "2"
members = ["crates/protocol", "crates/client", "crates/broker", "bindings/c", "bindings/python", "bindings/node", "xtask"]
default-members = ["crates/protocol", "crates/client", "crates/broker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
dictation-protocol = { path = "crates/protocol", version = "0.1.0" }
dictation-api = { path = "crates/client", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"

[profile.release]
lto = "thin"
strip = "debuginfo"

